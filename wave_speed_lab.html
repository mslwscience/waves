<title>Wave Speed Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>

/* Layout: a lab "mission console" — briefing card on the left, live wave scope on the right, controls under the scope. Stacks on phones. */
:root{
  --bg:#0d1b26; --panel:#142838; --panel2:#1b3447; --line:#2f4d63;
  --fg:#f2f6f9; --muted:#b9c9d6;
  --waveA:#E69F00; --waveB:#56B4E9; --sum:#ffffff;
  --go:#3fd38f; --warn:#ffcc4d; --bad:#ff8f8f;
  --btn:#ffd166; --btnfg:#14212c;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);margin:0;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-size:16px;font-weight:500;color:var(--muted);margin-top:4px;font-family:var(--body)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-family:var(--display);font-weight:600;font-size:14px;min-width:38px;height:38px;border-radius:19px;border:2px solid var(--line);
  background:var(--panel);color:var(--muted);display:grid;place-items:center;padding:0 10px;cursor:pointer}
.step[aria-current="true"]{border-color:var(--btn);color:var(--fg)}
.step.done{background:var(--go);border-color:var(--go);color:#0b2a1c}
.step:disabled{cursor:not-allowed;opacity:.55}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.brief{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 10px;border-radius:8px;background:var(--panel2);color:var(--warn);border:1.5px solid var(--warn)}
.tag.con{color:var(--go);border-color:var(--go)}
.brief h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1.15}
.brief p{margin:0}
.goal{background:var(--panel2);border-radius:12px;padding:10px 12px;border-left:5px solid var(--btn)}
.goal b{font-family:var(--display);font-weight:600;color:var(--btn)}
.art{display:flex;justify-content:center}
.scope{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:700;font-size:15px}
.legend span{display:flex;align-items:center;gap:7px}
.legend svg{flex:none}
canvas{width:100%;height:300px;display:block;border-radius:10px;background:#0a1620}
.meter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter .lab{font-family:var(--display);font-weight:600;min-width:150px}
.bar{flex:1;min-width:160px;height:22px;border-radius:11px;background:#0a1620;border:2px solid var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--warn);transition:width .25s}
.bar .target{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--fg)}
.meter .val{font-family:var(--display);font-weight:700;font-size:20px;min-width:70px;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctl{display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px}
.ctl label{font-weight:700}
input[type=range]{width:100%;accent-color:var(--waveB);height:30px}
button{font-family:var(--display);font-weight:600;font-size:17px;border-radius:12px;border:2px solid transparent;padding:9px 16px;cursor:pointer;
  background:var(--btn);color:var(--btnfg)}
button.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line)}
button:focus-visible,.step:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.status{font-family:var(--display);font-weight:600;font-size:19px;min-height:28px}
.status.win{color:var(--go)}
.check{background:var(--panel);border:2px solid var(--go);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.check h3{font-family:var(--display);font-size:22px;margin:0;color:var(--go)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel2);color:var(--fg);border:2px solid var(--line);font-family:var(--body);font-weight:400;font-size:16.5px}
.opt.right{border-color:var(--go);background:#173d2e}
.opt.wrong{border-color:var(--bad);background:#3c2024}
.explain{margin:0;color:var(--fg)}
.quiz{display:grid;gap:10px}
.qcard{background:var(--panel2);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qcard p{margin:0;flex:1;min-width:220px}
.qcard .row button{font-size:15px;padding:7px 12px}
.mark{font-weight:700;min-width:20px}
.final{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:10px}
.code{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.08em;color:var(--btn);background:var(--panel2);padding:8px 20px;border-radius:14px;border:2px dashed var(--btn)}
.note{font-size:14.5px;color:var(--muted)}
.vocab{display:flex;gap:6px;flex-wrap:wrap}
.vocab span{font-size:13.5px;font-weight:700;border:1.5px solid var(--muted);border-radius:7px;padding:1px 8px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* kangaroo-race additions */
canvas{height:340px}
.pred{display:flex;flex-wrap:wrap;gap:8px}
.pred button.on{outline:3px solid var(--fg);outline-offset:2px}
.stats{width:100%;border-collapse:collapse;font-size:15.5px;font-variant-numeric:tabular-nums}
.stats th,.stats td{border:1.5px solid var(--line);padding:6px 8px;text-align:center}
.stats th{background:var(--panel2);font-family:var(--display);font-weight:600}
.stats td.k{color:var(--waveA);font-weight:700}.stats td.b{color:var(--waveB);font-weight:700}
.big{font-family:var(--display);font-weight:700;font-size:24px}
.myth{display:grid;gap:10px}
.callout{background:var(--panel2);border-radius:12px;padding:10px 12px;border-left:5px solid var(--waveB)}
</style>

<div class="wrap">
  <header>
    <h1>Wave Speed Lab<small>Unit 4 · 4.12 Explore Sound in a Medium · Ms. Welch's Science 7</small></h1>
    <div class="row" style="align-items:center"><button id="mute" class="ghost" style="font-size:14px;padding:6px 12px">🔊 Sound on</button><nav class="steps" id="steps" aria-label="Missions"></nav></div>
  </header>
  <div class="grid">
    <section class="brief" id="brief" aria-live="polite"></section>
    <section class="scope" id="scope">
      <div class="legend" id="legend"></div>
      <canvas id="cv" role="img" aria-label="Animated race scene"></canvas>
      <div class="controls" id="controls"></div>
      <div class="status" id="status" role="status"></div>
    </section>
  </div>
  <section id="after" hidden></section>
</div>

<script>
(function(){
const $ = id => document.getElementById(id);
const TAU = Math.PI*2, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const KC = '#E69F00', BC = '#56B4E9', WH = '#f2f6f9';
/* ---- sound (starts only after a button press) ---- */
let AC=null, MUTE=false;
function ac(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(freq,dur,vol,type,delay){ if(MUTE) return; const a=ac(); if(!a) return; const t0=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=freq; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||0.25,t0+0.03); g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.05); }
function thunder(delay){ if(MUTE) return; const a=ac(); if(!a) return; const t0=a.currentTime+(delay||0), n=a.sampleRate*2.6, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  let last=0; for(let i=0;i<n;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; d[i]=last*3.5*(1-i/n); }
  const src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); src.buffer=buf; f.type='lowpass'; f.frequency.value=160; g.gain.value=MUTE?0:1.6;
  src.connect(f).connect(g).connect(a.destination); src.start(t0); }
const SQUEAK=()=>{ tone(1180,0.18,0.18,'triangle'); tone(1320,0.22,0.16,'triangle',0.16); };
const RUMBLE=()=>{ tone(95,0.55,0.4,'sawtooth'); tone(80,0.5,0.25,'sine',0.05); };
const CODE = 'HOP-TIE-403';

/* ------------ missions ------------ */
const M = [
 {id:'tramp', s:'1', tag:'Warm-Up', title:'Trampoline Frequency',
  story:'Warm-up! Mia and Leo are on trampolines. Each bounce is like one wave. The graph next to each kid tracks <b>how high</b> they are, second by second. The ball rides the graph so you can follow it.',
  goal:'Change how often Mia bounces. Watch her graph. Then answer the questions.', words:true},
 {id:'predict', s:'2', tag:'Predict', title:'Who Will Win?',
  story:'Kiki takes <b>short, frequent hops</b>: 4 hops every second (her <b>frequency</b>), 1 meter each (her <b>wavelength</b>). Bo takes <b>long, less frequent hops</b>: 1 hop every second (his <b>frequency</b>), 4 meters each (his <b>wavelength</b>). They race 12 meters.',
  words:true,
  goal:'Study each kangaroo\'s hop pattern. Then make your prediction.'},
 {id:'watch', s:'3', tag:'The Race', title:'The Big Race',
  story:'Time to race! Watch each kangaroo ride its hop pattern from the start line to the finish line.',
  goal:'Watch the race. Then answer the Science Check.',
  q:{t:'Why did Kiki and Bo tie?', o:['Kiki hops 4 times as often, but Bo\'s hops are 4 times as long. They both cover 4 meters every second.','Kiki wins because she hops more often.','Bo wins because his hops are longer.','The race was rigged.'], a:0,
     e:'Wave speed is how far you go each second. Kiki: 1 m × 4 hops = 4 m/s. Bo: 4 m × 1 hop = 4 m/s. A higher <b>frequency</b> is not a higher speed, and a longer <b>wavelength</b> is not a higher speed.'}},
 {id:'trail', s:'4', tag:'Hops Make Waves', title:'Hops Make Waves',
  story:'Look at the path each kangaroo leaves behind. Each hop is like one wave! The top of a hop is a <b>crest</b>. The length of one hop is the <b>wavelength</b>. Hops per second is the <b>frequency</b>.',
  goal:'Answer the three wave questions about the paths.', words:true},
 {id:'rope', s:'5', tag:'Speed Predictions', title:'Rope Race',
  story:'Two friends shake ropes tied to a wall. First, watch the <b>preview</b>: the dotted line shows the wave each person will make. Then predict which wave slaps the wall first.',
  goal:'Make a prediction for all four rounds.'},
 {id:'medium', s:'6', tag:'Same Frequency', title:'Same Note, New Medium',
  story:'A tuning fork plays one note: <b>440 waves every second</b> (440 Hz). The same note travels through <b>air</b>, <b>water</b>, and a <b>steel</b> rail at the same moment. Then a thunderstorm rolls in.',
  goal:'Predict which medium carries the note fastest. Then predict: lightning or thunder?',
  q:{t:'Light from lightning reaches you long before the thunder. Is that because light has a different frequency?', o:['No. Light is an electromagnetic wave and sound is a mechanical wave. They are different kinds of waves, so they travel at different speeds.','Yes. Higher frequency always means faster.','Yes. Thunder has a longer wavelength, so it is slower.','No. The thunder stops to rest.'], a:0,
     e:'Frequency does not set speed. The 440 Hz note had the <b>same frequency</b> in air, water, and steel, but <b>different speeds</b>, because the medium changed. Light is a different kind of wave (electromagnetic), so it is far faster than any sound.'}},
 {id:'can', s:'7', tag:'Real World', title:'Tin Can Phones',
  story:'Squeak the mouse has a tiny, <b>high</b> voice. Rumble the hippo has a huge, <b>low</b> voice. Each one has a tin can phone with the same kind of string, stretched all the way to Kiki the kangaroo. They yell "HELLO!" at the exact same moment.',
  goal:'Listen to each voice and watch its preview wave. Predict whose "HELLO!" reaches Kiki first. Then send it.',
  q:{t:'A band plays in a big park. You sit far away. Do the high notes reach you before the low notes?', o:['No. In the same air, high and low sounds travel at the same speed, so the song sounds right.','Yes. High notes have a higher frequency, so they arrive first.','Yes. Low notes have longer wavelengths, so they arrive first.','No. Low notes stop halfway.'], a:0,
     e:'If speed depended on pitch, music from far away would arrive scrambled! The speed of sound depends on the <b>medium</b> (air, water, steel, string), not on frequency or wavelength.'}},
 {id:'myth', s:'★', tag:'Myth Busters', title:'Fact or Myth?', quiz:true,
  story:'Last mission! Sort each statement as a fact or a myth.',
  goal:'Get all eight right to earn your code.',
  items:[['Waves with a higher frequency travel faster.','M'],
         ['Two waves in the same medium travel at the same speed.','F'],
         ['A wave with a longer wavelength travels faster.','M'],
         ['A wave speeds up or slows down when it enters a new medium.','F'],
         ['Bouncing up and down more often means moving forward faster.','M'],
         ['Speed = wavelength × frequency, so if frequency goes up, wavelength goes down.','F'],
         ['The same note (same frequency) travels faster through steel than through air.','F'],
         ['At a far-away concert, the high notes reach you before the low notes.','M']]}
];
const ROUNDS = [
 {ask:'Same rope. Top: <b>low</b> frequency. Bottom: <b>high</b> frequency.', top:{f:1,A:22,v:1,lab:'Low frequency'}, bot:{f:3,A:22,v:1,lab:'High frequency'}, ans:'tie',
  why:'Tie! The high-frequency wave has a shorter wavelength, but both travel at the same speed on the same rope. Frequency does not change wave speed.'},
 {ask:'Same rope. Top: <b>small</b> amplitude. Bottom: <b>big</b> amplitude.', top:{f:2,A:9,v:1,lab:'Small amplitude'}, bot:{f:2,A:30,v:1,lab:'Big amplitude'}, ans:'tie',
  why:'Tie again! A bigger wave carries more energy, but it is not faster.'},
 {ask:'Same frequency. Top: a <b>heavy, thick rope</b>. Bottom: a <b>light, tight rope</b>. (Notice: on the slower rope, the waves get squished closer together.)', top:{f:2,A:22,v:0.55,lab:'Heavy rope (new medium)'}, bot:{f:2,A:22,v:1,lab:'Light, tight rope'}, ans:'bot',
  why:'The light, tight rope wins. A different medium is the only thing that changed the speed!'},
 {change:true, ask:'A friend <b>claps once</b>. In the top tank, the pulse goes through <b>air</b>, then <b>water</b> (same distance each). In the bottom demo tank, it goes through <b>air</b> the whole way. What happens to the top pulse in the water?', ans:'fast',
  why:'The clap <b>sped up</b> in the water! The two pulses stayed side by side in the air, then the top one pulled ahead and arrived first. Its dots spread farther apart in the water. Same clap, new <b>medium</b>, new <b>speed</b>. (Sound is about 4 times faster in water than in air.)'}
];

/* ------------ state ------------ */
let cur=0, done=new Array(M.length).fill(false), st={};
try{const s=JSON.parse(localStorage.getItem('wsl412c')||'null'); if(s&&Array.isArray(s.done)) done=M.map((_,i)=>!!s.done[i]);}catch(e){}
const save=()=>{try{localStorage.setItem('wsl412c',JSON.stringify({done}));}catch(e){}};
const unlocked=i=>i===0||done[i-1];
function steps(){
  $('steps').innerHTML=M.map((m,i)=>`<button class="step ${done[i]?'done':''}" aria-current="${i===cur}" ${unlocked(i)?'':'disabled'} data-i="${i}" aria-label="Mission ${i+1}: ${m.title}">${m.s}</button>`).join('');
  $('steps').querySelectorAll('.step').forEach(b=>b.onclick=()=>load(+b.dataset.i));
}

/* ------------ canvas ------------ */
const cv=$('cv'), cx=cv.getContext('2d'); let W=0,H=0;
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',()=>{size();});
const text=(s,x,y,c,sz,al)=>{cx.fillStyle=c||WH;cx.font=`600 ${sz||14}px Fredoka, sans-serif`;cx.textAlign=al||'left';cx.fillText(s,x,y);cx.textAlign='left';};

function shade(hex,k){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; r=Math.round(r*k);g=Math.round(g*k);b=Math.round(b*k); return `rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`; }
function roo(x,y,col,sc,air,lab){ // side-view kangaroo facing right, feet at (x,y). air: 0 = crouched on ground, 1 = fully stretched mid-hop
  sc=sc||1; air=air||0; const dark=shade(col,0.62), light=shade(col,1.25);
  cx.save(); cx.translate(x,y); cx.scale(sc,sc);
  const lean = -0.35 - air*0.25;                       // body tilts forward more in the air
  cx.lineJoin='round'; cx.lineCap='round';
  // tail: thick tapered curve back to the ground
  cx.fillStyle=dark; cx.beginPath();
  cx.moveTo(-10,-20); cx.bezierCurveTo(-28,-16,-42,-6+air*6,-58,2-air*10); cx.lineTo(-60,-2-air*10);
  cx.bezierCurveTo(-44,-14+air*4,-30,-26,-12,-30); cx.closePath(); cx.fill();
  // hind leg: big thigh + long foot (stretches back when in the air)
  cx.fillStyle=dark; cx.beginPath(); cx.ellipse(-2,-18,13,10,-0.4,0,TAU); cx.fill();
  cx.strokeStyle=dark; cx.lineWidth=6;
  const kx=4+air*2, ky=-6+air*2, fx=-6-air*16, fy=0+air*2;
  cx.beginPath(); cx.moveTo(0,-14); cx.lineTo(kx,ky); cx.lineTo(fx+22,fy); cx.stroke();
  cx.lineWidth=5; cx.beginPath(); cx.moveTo(fx+22,fy); cx.lineTo(fx+30-air*12,fy+air*4); cx.stroke();
  // body
  cx.save(); cx.translate(4,-30); cx.rotate(lean);
  cx.fillStyle=col; cx.beginPath(); cx.ellipse(0,0,13,21,0,0,TAU); cx.fill();
  cx.fillStyle=light; cx.beginPath(); cx.ellipse(6,4,6,13,0,0,TAU); cx.fill();   // belly
  cx.restore();
  // little arms
  cx.strokeStyle=dark; cx.lineWidth=3.5; cx.beginPath(); cx.moveTo(14,-38); cx.lineTo(22,-30+air*3); cx.lineTo(25,-28+air*3); cx.stroke();
  // neck + head
  cx.fillStyle=col; cx.beginPath(); cx.ellipse(16,-50,7,9,0.5,0,TAU); cx.fill();
  cx.beginPath(); cx.moveTo(14,-60); cx.bezierCurveTo(22,-66,34,-62,38,-56); cx.bezierCurveTo(36,-52,30,-50,20,-50); cx.closePath(); cx.fill(); // snout
  cx.beginPath(); cx.ellipse(18,-58,8,7,0,0,TAU); cx.fill();
  cx.fillStyle='#14212c'; cx.beginPath(); cx.arc(37,-56,1.8,0,TAU); cx.fill();            // nose
  cx.beginPath(); cx.arc(23,-60,1.9,0,TAU); cx.fill();                                    // eye
  // ears
  cx.fillStyle=col; cx.beginPath(); cx.moveTo(12,-63); cx.quadraticCurveTo(4,-80,10,-84); cx.quadraticCurveTo(16,-76,17,-64); cx.closePath(); cx.fill();
  cx.fillStyle=dark; cx.beginPath(); cx.moveTo(17,-63); cx.quadraticCurveTo(14,-78,20,-82); cx.quadraticCurveTo(24,-74,21,-62); cx.closePath(); cx.fill();
  cx.restore();
  if(lab) text(lab,x,y-92*sc,col,14,'center');
}

/* ===== Mission 1/2 race model ===== */
const L=12, V=4, KIKI={f:4,h:1,col:KC,name:'Kiki'}, BO={f:1,h:4,col:BC,name:'Bo'};
// each hop = one wave. Position along the track x (m); height follows a smooth wave with wavelength = hop length
const waveY=(r,x)=>Math.sin(TAU*x/r.h);
const slope=(r,x)=>Math.cos(TAU*x/r.h)*TAU/r.h;
function drawRace(t,trail,preview,warm){
  cx.clearRect(0,0,W,H);
  const nar=W<560, pad=nar?44:70, sx=(W-pad-(nar?24:40))/L, lanes=[H*0.33,H*0.8], A=nar?16:Math.min(30,H*0.1), sc=Math.min(nar?0.5:0.75,H/440);
  const tt=Math.max(0,Math.min(t,L/V));
  [[KIKI,lanes[0]],[BO,lanes[1]]].forEach(([r,y])=>{
    cx.strokeStyle='#3d5c73'; cx.lineWidth=1.2; cx.setLineDash([5,5]); cx.beginPath(); cx.moveTo(pad,y); cx.lineTo(pad+L*sx,y); cx.stroke(); cx.setLineDash([]);
    for(let m=0;m<=L;m+=2){ cx.fillStyle='#b9c9d6'; cx.fillRect(pad+m*sx-1,y+A+6,2,6); text(m+' m',pad+m*sx,y+A+24,'#b9c9d6',11,'center'); }
    text(nar?`${r.name}: f = ${r.f}/s, λ = ${r.h} m`:`${r.name}: frequency ${r.f} hop${r.f>1?'s':''}/s · wavelength ${r.h} m`, pad, y-A-34*sc-14, r.col, 14);
    const path=(x0,x1)=>{ cx.beginPath(); for(let x=x0;x<=x1+1e-9;x+=0.02){ const X=pad+x*sx, Y=y-waveY(r,x)*A; x===x0?cx.moveTo(X,Y):cx.lineTo(X,Y);} cx.stroke(); };
    if(preview!==false){ cx.save(); cx.globalAlpha=0.55; cx.strokeStyle=r.col; cx.lineWidth=3; cx.setLineDash([3,5]); path(0,L); cx.restore(); cx.setLineDash([]); }
    if(t===0){ const c1=pad+r.h*0.25*sx, c2=pad+r.h*1.25*sx, cy=y-A-8;

function drawRope(t,R,preview){ // preview: t drives only the hand + dotted pattern

function drawPulse(t,preview){ // one clap = one pulse; two demo tanks: air→water (top) and air only (bottom)
  cx.clearRect(0,0,W,H);

  if(clap){ cx.moveTo(fx,fy-38); cx.lineTo(fx+16,fy-48); cx.moveTo(fx,fy-38); cx.lineTo(fx+16,fy-44); } else { cx.moveTo(fx,fy-38); cx.lineTo(fx+18,fy-56); cx.moveTo(fx,fy-38); cx.lineTo(fx+18,fy-30); }
  cx.stroke(); cx.lineCap='butt';

    const ptAt=(d,off)=>[sx+Math.cos(ang)*d-Math.sin(ang)*off, cy+Math.sin(ang)*d+Math.cos(ang)*off];
    const draw=(d0,d1,dash,alpha,ph)=>{ cx.save(); cx.globalAlpha=alpha; cx.strokeStyle=col; cx.lineWidth=3; cx.setLineDash(dash); cx.beginPath();
      for(let d=d0; d<=d1; d+=2){ const [X,Y]=ptAt(d, -10*Math.sin(TAU*(ph-d)/lam)); d===d0?cx.moveTo(X,Y):cx.lineTo(X,Y);} cx.stroke(); cx.restore(); cx.setLineDash([]); };
    if(preview) draw(0,L2,[3,5],0.65,(t*v)%lam);            // animated dotted preview along the string
    else { const front=Math.min(L2,v*t); if(front>0) draw(0,front,col===BC?[10,6]:[],1,front); if(front>=L2) text('heard!',ex-6,ey+(i?36:-22),'#ffd166',14,'right'); }
  });
  text(preview?(nar?'Preview: each voice\'s wave':'Preview: the dotted lines show each voice\'s sound wave'):(nar?'Slow motion!':'Slow motion: real sound is much faster!'),8,18,WH,14);
}

/* ------------ animation driver ------------ */
let anim=null;
function play(draw, dur, onEnd){
  if(anim) cancelAnimationFrame(anim);
  // always animate: the student pressed a button to watch this, and the motion is the lesson
  const t0=performance.now();
  const step=now=>{ const t=(now-t0)/1000; draw(Math.min(t,dur)); if(t<dur) anim=requestAnimationFrame(step); else {anim=null; onEnd&&onEnd();} };
  anim=requestAnimationFrame(step);
}
function loopDraw(draw){ if(anim) cancelAnimationFrame(anim); const t0=performance.now(); const step=now=>{ draw((now-t0)/1000); anim=requestAnimationFrame(step); }; anim=requestAnimationFrame(step); }

function drawCert(name,o){
  const W=1000,H=600,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const F=(w,s,f)=>`${w} ${s}px ${f==='b'?"'Atkinson Hyperlegible',Verdana,sans-serif":"Fredoka,'Trebuchet MS',sans-serif"}`;
